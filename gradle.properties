# ビルド時のJava設定、MODのバージョン、Minecraftと依存MODのバージョンを管理します。
# Gradleに割り当てるメモリを増やします。
# WindowsのJava起動処理が引数ファイルを既定の文字コードで読むため、
# 日本語を含むプロジェクトパスでも動作するようにCOMPATを指定します。
# Javaソースの文字コードはbuild.gradle側でUTF-8に設定します。
org.gradle.jvmargs=-Xmx1G -Dfile.encoding=COMPAT
org.gradle.parallel=true

# IntelliJ IDEAとの互換性のため構成キャッシュを無効にします。
# 参考: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Minecraft・Fabricのバージョン設定（確認先: https://fabricmc.net/develop）。
minecraft_version=1.21.11
loader_version=0.18.4
loom_version=1.17.20

# MOD本体のバージョンと公開時のグループ名。
mod_version=1.0.0
maven_group=jp.voicevoxchat

# ビルドで参照する依存MODのバージョン。
fabric_api_version=0.141.5+1.21.11
modmenu_version=17.0.0-beta.1
